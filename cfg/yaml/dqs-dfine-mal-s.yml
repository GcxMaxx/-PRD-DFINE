__include__: [
  '../dataset/plad.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

# output_dir: ./outputs/dq-df_mal_s_plad-16-manet-lwga
# output_dir: ./outputs/df_mal_s_plad-16-MANe
output_dir: ./outputs/dqs-df-mal-s-plad-16-base
# output_dir: ./outputs/dqs-df-mal-s-plad-16-manet-tab

yolo_metrice: True

postprocessor: DQPostProcessor

model: DEIM_GG

DEIM_GG:
  yaml_path: configs/cfg-improve/dqs-dfine-mal-s.yaml
  # yaml_path: configs/cfg-improve/dfine-s-manet-tab.yaml


DQSDFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_layers: 6
  eval_idx: -1
  num_queries: 300

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  # NEW
  reg_max: 32
  reg_scale: 4

  # Auxiliary decoder layers dimension scaling
  # "eg. If num_layers: 6 eval_idx: -4,
  # then layer 3, 4, 5 are auxiliary decoder layers."
  layer_scale: 1  # 2


  num_points: [3, 6, 3] # [4, 4, 4] [3, 6, 3]
  cross_attn_method: default # default, discrete
  query_select_method: default # default, agnostic

  dim_feedforward: 1024

  using_densitymap_iter: 10000
  using_dynamic_query: True
  query_factor: 5



optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 132 # 120 + 4n
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 120
  collate_fn:
    stop_epoch: 120
    ema_restart_decay: 0.9999
    base_size_repeat: 20   #~关闭多尺度平时是20

## Our Loss
DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_densitymap: 10, loss_densitycount: 0.2}
  losses: ['mal', 'boxes', 'local', 'densitymap', 'densitycount']
  ccm_params: [10, 100, 500]
  gamma: 1.5
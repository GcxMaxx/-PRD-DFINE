task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 17 # after removing class id=18 → 0..16
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mnt/data/user/gg/deim/dataset/InsPLAD-det/train
    ann_file: /mnt/data/user/gg/deim/dataset/InsPLAD-det/annotations/instances_train_cat0_16.json        
    # img_folder: /mnt/data/user/gg/deim/dataset/InsPLAD-det/train1
    # ann_file: /mnt/data/user/gg/deim/dataset/InsPLAD-det/annotations1/instances_train_cat0_16_subset.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction



task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 4 # your dataset classes
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    # img_folder: /mnt/data/user/gg/deim/dataset/ididitrue/train/img
    # ann_file: /mnt/data/user/gg/deim/dataset/ididitrue/train.json   
    img_folder: /mnt/data/user/gg/deim/dataset/idid121/train
    ann_file: /mnt/data/user/gg/deim/dataset/idid121/train/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction


